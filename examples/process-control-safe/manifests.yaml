apiVersion: kuudra.io/v1alpha2
kind: EventSource
metadata: {namespace: process-control-demo, name: trigger}
spec:
  template: kuudra-official/session-probe/session-probe-source
  options:
    eventType: process-control.trigger
    initialDelayMillis: 5000
    maxEvents: 1
---
apiVersion: kuudra.io/v1alpha2
kind: Ingress
metadata: {namespace: process-control-demo, name: ingress}
spec:
  template: kuudra-official/default/plain-ingress
---
apiVersion: kuudra.io/v1alpha2
kind: Controller
metadata: {namespace: process-control-demo, name: process-control}
spec:
  template: actforever/process-control/process-controller
  options:
    allowElevation: true
    targets:
      ping:
        executablePath: 'C:\Windows\System32\PING.EXE'
    defaultDurationMillis: 10000
    maxDurationMillis: 60000
---
apiVersion: kuudra.io/v1alpha2
kind: Ability
metadata: {namespace: process-control-demo, name: process-control-safe}
spec:
  resources:
    trigger: {kind: EventSource, name: trigger}
    ingress: {kind: Ingress, name: ingress}
    process-control: {kind: Controller, name: process-control}
  nodes:
    trigger: {resource: trigger}
    ingress:
      resource: ingress
      arguments: {groupKey: process-control}
      session:
        mode: CREATE
    process-control:
      resource: process-control
      handler: suspend
      arguments: {target: ping, durationMillis: 2000}
  edges:
    - {from: trigger, to: ingress}
    - {from: ingress, to: process-control}
