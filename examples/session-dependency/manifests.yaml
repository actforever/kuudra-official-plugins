apiVersion: kuudra.io/v1alpha2
kind: EventSource
metadata: {namespace: dependency-demo, name: window-source}
spec:
  template: kuudra-official/session-probe/session-probe-source
  options: {role: window, groupKey: window, initialDelayMillis: 0, maxEvents: 1}
---
apiVersion: kuudra.io/v1alpha2
kind: Ingress
metadata: {namespace: dependency-demo, name: window-entry}
spec: {template: kuudra-official/conditional-boundary/conditional-ingress}
---
apiVersion: kuudra.io/v1alpha2
kind: Controller
metadata: {namespace: dependency-demo, name: window-handler}
spec: {template: kuudra-official/session-probe/session-probe}
---
apiVersion: kuudra.io/v1alpha2
kind: EventSource
metadata: {namespace: dependency-demo, name: job-source}
spec:
  template: kuudra-official/session-probe/session-probe-source
  options: {role: job, groupKey: jobs, initialDelayMillis: 500, intervalMillis: 100, maxEvents: 2}
---
apiVersion: kuudra.io/v1alpha2
kind: Ingress
metadata: {namespace: dependency-demo, name: job-entry}
spec: {template: kuudra-official/conditional-boundary/conditional-ingress}
---
apiVersion: kuudra.io/v1alpha2
kind: Controller
metadata: {namespace: dependency-demo, name: job-handler}
spec: {template: kuudra-official/session-probe/session-probe}
---
apiVersion: kuudra.io/v1alpha2
kind: Ability
metadata: {namespace: dependency-demo, name: dependency-ability}
spec:
  resources:
    window-source: {kind: EventSource, name: window-source}
    window-entry: {kind: Ingress, name: window-entry}
    window-handler: {kind: Controller, name: window-handler}
    job-source: {kind: EventSource, name: job-source}
    job-entry: {kind: Ingress, name: job-entry}
    job-handler: {kind: Controller, name: job-handler}
  nodes:
    window-source: {resource: window-source}
    window-entry:
      resource: window-entry
      arguments: {condition: true, groupKey: window, sessionLabels: {role: window}}
      session:
        mode: CREATE
        scheduling: {policy: PARALLEL, groupScope: INGRESS, maxParallelSessions: 1, queueCapacity: 0}
    window-handler:
      resource: window-handler
      handler: hold
      arguments: {label: window, durationMillis: 3000}
    job-source: {resource: job-source}
    job-entry:
      resource: job-entry
      arguments: {condition: true, groupKey: jobs, sessionLabels: {role: job}}
      session:
        mode: CREATE
        scheduling: {policy: SERIAL, groupScope: INGRESS, maxParallelSessions: 1, queueCapacity: 2}
        dependencies:
          - requiredSessionSelector:
              matchLabels: {role: window}
              matchPolicy: UNIQUE
            terminationPropagation: CANCEL_DEPENDENT
    job-handler:
      resource: job-handler
      handler: hold
      arguments: {label: job, durationMillis: 10000}
  edges:
    - {from: window-source, to: window-entry}
    - {from: window-entry, to: window-handler}
    - {from: job-source, to: job-entry}
    - {from: job-entry, to: job-handler}
