apiVersion: kuudra.io/v1alpha1
kind: EventSource
metadata: {namespace: dependency-demo, name: window-source}
spec:
  component: kuudra-official/session-probe-source
  desiredState: running
  options: {role: window, groupKey: window, initialDelayMillis: 0, maxEvents: 1}
---
apiVersion: kuudra.io/v1alpha1
kind: Ingress
metadata: {namespace: dependency-demo, name: window-entry}
spec:
  component: kuudra-official/conditional-ingress
  desiredState: active
  options:
    condition: true
    groupKey: window
    sessionLabels: {role: window}
---
apiVersion: kuudra.io/v1alpha1
kind: EventHandler
metadata: {namespace: dependency-demo, name: window-handler}
spec:
  component: kuudra-official/session-probe-handler
  desiredState: running
  options: {label: window, durationMillis: 3000}
---
apiVersion: kuudra.io/v1alpha1
kind: EventSource
metadata: {namespace: dependency-demo, name: job-source}
spec:
  component: kuudra-official/session-probe-source
  desiredState: running
  options: {role: job, groupKey: jobs, initialDelayMillis: 500, intervalMillis: 100, maxEvents: 2}
---
apiVersion: kuudra.io/v1alpha1
kind: Ingress
metadata: {namespace: dependency-demo, name: job-entry}
spec:
  component: kuudra-official/conditional-ingress
  desiredState: active
  options:
    condition: true
    groupKey: jobs
    sessionLabels: {role: job}
---
apiVersion: kuudra.io/v1alpha1
kind: EventHandler
metadata: {namespace: dependency-demo, name: job-handler}
spec:
  component: kuudra-official/session-probe-handler
  desiredState: running
  options: {label: job, durationMillis: 10000}
---
apiVersion: kuudra.io/v1alpha1
kind: SessionCoordinationPolicy
metadata: {namespace: dependency-demo, name: window-parallel}
spec:
  selector:
    matchLabels: {role: window}
  scheduling:
    policy: PARALLEL
    maxParallelSessions: 1
    queueCapacity: 0
---
apiVersion: kuudra.io/v1alpha1
kind: SessionCoordinationPolicy
metadata: {namespace: dependency-demo, name: jobs-in-window}
spec:
  selector:
    matchLabels: {role: job}
  scheduling:
    policy: SERIAL
    maxParallelSessions: 1
    queueCapacity: 2
  dependencies:
    - requiredSessionSelector:
        matchLabels: {role: window}
        matchPolicy: UNIQUE
      terminationPropagation: CANCEL_DEPENDENT
---
apiVersion: kuudra.io/v1alpha1
kind: Flow
metadata: {namespace: dependency-demo, name: dependency-flow}
spec:
  imports:
    window-source: {kind: EventSource, name: window-source}
    window-entry: {kind: Ingress, name: window-entry}
    window-handler: {kind: EventHandler, name: window-handler}
    job-source: {kind: EventSource, name: job-source}
    job-entry: {kind: Ingress, name: job-entry}
    job-handler: {kind: EventHandler, name: job-handler}
  edges:
    - {from: window-source, to: window-entry}
    - {from: window-entry, to: window-handler}
    - {from: job-source, to: job-entry}
    - {from: job-entry, to: job-handler}
