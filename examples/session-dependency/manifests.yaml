apiVersion: kuudra.io/v1alpha1
kind: EventSource
metadata: {namespace: dependency-demo, name: window-source}
spec:
  component: kuudra-official/session-probe-source
  desiredState: running
  options: {role: window, groupKey: window, initialDelayMillis: 0, maxEvents: 1}
---
apiVersion: kuudra.io/v1alpha1
kind: Ingress
metadata: {namespace: dependency-demo, name: window-entry}
spec:
  component: kuudra-official/conditional-ingress
  desiredState: active
  options: {condition: true, groupKey: window, policy: SERIAL}
---
apiVersion: kuudra.io/v1alpha1
kind: EventHandler
metadata: {namespace: dependency-demo, name: window-handler}
spec:
  component: kuudra-official/session-probe-handler
  desiredState: running
  options: {label: window, durationMillis: 3000}
---
apiVersion: kuudra.io/v1alpha1
kind: Flow
metadata: {namespace: dependency-demo, name: window-flow}
spec:
  imports:
    source: {kind: EventSource, name: window-source}
    ingress: {kind: Ingress, name: window-entry}
    handler: {kind: EventHandler, name: window-handler}
  edges: [{from: source, to: ingress}, {from: ingress, to: handler}]
---
apiVersion: kuudra.io/v1alpha1
kind: EventSource
metadata: {namespace: dependency-demo, name: job-source}
spec:
  component: kuudra-official/session-probe-source
  desiredState: running
  options: {role: job, groupKey: jobs, initialDelayMillis: 500, intervalMillis: 100, maxEvents: 2}
---
apiVersion: kuudra.io/v1alpha1
kind: Ingress
metadata: {namespace: dependency-demo, name: job-entry}
spec:
  component: kuudra-official/conditional-ingress
  desiredState: active
  options:
    condition: true
    groupKey: jobs
    policy: SERIAL
    queueCapacity: 2
    dependencies:
      - selector:
          flowId: dependency-demo/window-flow
          ingressComponentId: ingress/dependency-demo/window-entry
          groupKey: window
          matchPolicy: UNIQUE
        terminationPolicy: CANCEL_DEPENDENT
---
apiVersion: kuudra.io/v1alpha1
kind: EventHandler
metadata: {namespace: dependency-demo, name: job-handler}
spec:
  component: kuudra-official/session-probe-handler
  desiredState: running
  options: {label: job, durationMillis: 10000}
---
apiVersion: kuudra.io/v1alpha1
kind: Flow
metadata: {namespace: dependency-demo, name: job-flow}
spec:
  imports:
    source: {kind: EventSource, name: job-source}
    ingress: {kind: Ingress, name: job-entry}
    handler: {kind: EventHandler, name: job-handler}
  edges: [{from: source, to: ingress}, {from: ingress, to: handler}]
