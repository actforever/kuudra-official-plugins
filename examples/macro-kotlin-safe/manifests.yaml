apiVersion: kuudra.io/v1alpha2
kind: EventSource
metadata: {namespace: macro-kotlin-demo, name: trigger}
spec:
  template: kuudra-official/hello-world/hello-world
  options: {intervalMillis: 500}
---
apiVersion: kuudra.io/v1alpha2
kind: Ingress
metadata: {namespace: macro-kotlin-demo, name: ingress}
spec: {template: kuudra-official/default/plain-ingress}
---
apiVersion: kuudra.io/v1alpha2
kind: Controller
metadata: {namespace: macro-kotlin-demo, name: robot}
spec:
  template: actforever/awt-robot/awt-robot
  options: {script: macros/safe-emit.kt, maxTotalSteps: 100, syntheticMarkerLifetimeMillis: 500}
---
apiVersion: kuudra.io/v1alpha2
kind: Controller
metadata: {namespace: macro-kotlin-demo, name: logger}
spec: {template: kuudra-official/logging/event-logger}
---
apiVersion: kuudra.io/v1alpha2
kind: Ability
metadata: {namespace: macro-kotlin-demo, name: safe-kotlin-macro}
spec:
  resources:
    source: {kind: EventSource, name: trigger}
    ingress: {kind: Ingress, name: ingress}
    robot: {kind: Controller, name: robot}
    logger: {kind: Controller, name: logger}
  nodes:
    source: {resource: source}
    ingress:
      resource: ingress
      arguments: {groupKey: "${event#hello-world.message}"}
      session: {mode: CREATE}
    robot: {resource: robot, handler: execute}
    logger:
      resource: logger
      handler: log
      arguments: {level: INFO, message: "Kotlin macro emitted ${event#macro.result}", includeData: true}
  edges:
    - {from: source, to: ingress}
    - {from: ingress, to: robot}
    - {from: robot, to: logger}
