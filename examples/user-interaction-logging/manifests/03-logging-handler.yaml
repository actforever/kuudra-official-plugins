apiVersion: kuudra.io/v1alpha1
kind: EventHandler
metadata:
  namespace: macro
  name: input-logger
spec:
  component: kuudra-official/event-logger
  desiredState: running
  options:
    level: INFO
    message: "Keyboard ${event#user-interaction.phase}: ${event#user-interaction.key.code}"
    includeData: true
