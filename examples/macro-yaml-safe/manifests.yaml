apiVersion: kuudra.io/v1alpha2
kind: EventSource
metadata: {namespace: macro-demo, name: trigger}
spec:
  template: kuudra-official/hello-world/hello-world
  options: {intervalMillis: 500}
---
apiVersion: kuudra.io/v1alpha2
kind: Ingress
metadata: {namespace: macro-demo, name: ingress}
spec: {template: kuudra-official/default/plain-ingress}
---
apiVersion: kuudra.io/v1alpha2
kind: Controller
metadata: {namespace: macro-demo, name: robot}
spec:
  template: actforever/awt-robot/awt-robot
  options:
    maxTotalSteps: 100
    steps:
      - action: if
        condition: {ref: event#hello-world.message, operator: EQUALS, value: hello-world}
        then:
          - action: emit
            eventType: macro.completed
            data: {macro: {result: yaml-executed}}
---
apiVersion: kuudra.io/v1alpha2
kind: Controller
metadata: {namespace: macro-demo, name: logger}
spec: {template: kuudra-official/logging/event-logger}
---
apiVersion: kuudra.io/v1alpha2
kind: Ability
metadata: {namespace: macro-demo, name: replay}
spec:
  resources:
    trigger: {kind: EventSource, name: trigger}
    ingress: {kind: Ingress, name: ingress}
    robot: {kind: Controller, name: robot}
    logger: {kind: Controller, name: logger}
  nodes:
    trigger: {resource: trigger}
    ingress:
      resource: ingress
      arguments: {groupKey: "${event#hello-world.message}"}
      session: {mode: CREATE}
    robot: {resource: robot, handler: execute}
    logger:
      resource: logger
      handler: log
      arguments: {level: INFO, message: "Macro result: ${event#macro.result}"}
  edges:
    - {from: trigger, to: ingress}
    - {from: ingress, to: robot}
    - {from: robot, to: logger}
